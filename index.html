<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Embervale</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1b2a;--ink:#1b1420;--paper:#f6e7c1;--gold:#ffd24a;--wood:#6b4220;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b2a}}
:root[data-theme="dark"]{--bg:#0d1b2a}
html,body{height:100%;margin:0}
body{background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  font-family:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace}
#wrap{position:relative;width:100%;height:100%;overflow:hidden}
canvas{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
#quest{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));top:54px;right:10px;color:#fff;font-size:10px;line-height:1.5;
  text-shadow:1px 1px 0 var(--ink),-1px 1px 0 var(--ink),1px -1px 0 var(--ink),-1px -1px 0 var(--ink),0 2px 0 var(--ink);pointer-events:none}
#dlg{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));
  box-sizing:border-box;background:var(--paper);color:var(--ink);border:4px solid var(--ink);
  box-shadow:inset 0 0 0 3px var(--wood),0 6px 0 rgba(0,0,0,.35);padding:14px 16px;font-size:11px;line-height:1.7;cursor:pointer}
#dlg[hidden]{display:none}
#dname{color:#a82f22;margin-bottom:6px}
#dbtn{margin-top:10px;display:flex;gap:10px;justify-content:flex-end;align-items:center;font-size:9px;color:var(--wood)}
#dbtn button{font:inherit;font-size:10px;padding:8px 10px;border:3px solid var(--ink);background:var(--gold);color:var(--ink);cursor:pointer}
#dbtn button.no{background:#d9c9a0}
#dbtn button:focus-visible{outline:3px solid #3b74d8}
#stage{position:relative;width:100%;height:100%;overflow:hidden}
#pad{display:none}
body.touch #pad{display:block;position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none}
body.touch #pad>*{pointer-events:auto;position:absolute}
#dir{left:calc(16px + env(safe-area-inset-left,0px));bottom:24px;width:168px;height:84px;display:flex;gap:8px}
#dir span{flex:1;display:flex;align-items:center;justify-content:center;border:4px solid var(--ink);border-radius:18px;
  background:rgba(246,231,193,.82);font:28px/1 system-ui,sans-serif;color:var(--ink)}
#dir.l #bl,#dir.r #br{background:var(--gold)}
.pad{border-radius:50%;border:4px solid var(--ink);font:inherit;color:var(--ink);padding:0}
.pad.on{filter:brightness(.82)}
#jump{right:calc(16px + env(safe-area-inset-right,0px));bottom:24px;width:86px;height:86px;background:rgba(255,210,74,.9);font-size:11px}
#atk{right:calc(112px + env(safe-area-inset-right,0px));bottom:52px;width:70px;height:70px;background:rgba(223,230,240,.9);font-size:9px}
body.touch #dlg{bottom:auto;top:10px}
body.portrait #wrap{display:flex;flex-direction:column}
body.portrait #stage{flex:none}
body.portrait #pad{position:relative;flex:1;pointer-events:auto;background:#16263a;border-top:4px solid var(--ink);
  box-shadow:inset 0 4px 0 #24405e}
body.portrait #dir,body.portrait #jump{bottom:auto;top:46%}
body.portrait #atk{bottom:auto;top:calc(46% - 22px)}
body.portrait #dlg{top:calc(var(--sh,50%) + 14px)}
#demo{position:absolute;top:8px;right:calc(8px + env(safe-area-inset-right,0px));font:inherit;font-size:9px;padding:8px 10px;
  border:3px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.35);cursor:pointer}
#demo.on{background:var(--gold)}
#cap{position:absolute;left:0;right:0;top:20%;text-align:center;color:#fff;font-size:16px;line-height:1.8;pointer-events:none;
  text-shadow:2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 4px 0 var(--ink)}
#cap small{display:block;font-size:9px;color:var(--gold)}
#cap[hidden]{display:none}
body.demoing:not(.portrait) #pad{visibility:hidden}
#probe{position:absolute;visibility:hidden;padding-left:env(safe-area-inset-left,0px)}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="game"></canvas><div id="quest"></div><div id="cap" hidden></div><button id="demo" aria-label="Show a quick demo of each area">Demo</button></div>
  <div id="pad">
    <div id="dir" role="group" aria-label="Run left or right"><span id="bl">&#9664;</span><span id="br">&#9654;</span></div>
    <button id="atk" class="pad" aria-label="Sword">Sword</button>
    <button id="jump" class="pad" aria-label="Jump">Jump</button>
  </div>
  <div id="dlg" hidden><div id="dname"></div><div id="dtext"></div><div id="dbtn"></div></div>
  <div id="probe"></div>
</div>
<script>
(()=>{'use strict';
const T=16,INK='#1b1420';
const $=id=>document.getElementById(id);
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
function rng(s){return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=rng(20261002),ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const hash=(x,y)=>{let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296;};
const sm=t=>t*t*(3-2*t);
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),fx=sm(x-xi),fy=sm(y-yi),a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy;}
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const hex=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------- pixel helpers ---------- */
const px=(g,x,y,c,w=1,h=1)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h);};
function disc(g,cx,cy,r,c,sq=1){g.fillStyle=c;cx=Math.round(cx);cy=Math.round(cy);const ry=Math.max(1,Math.round(r*sq));
  for(let y=-ry;y<=ry;y++){const w=Math.round(r*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry+.6))));g.fillRect(cx-w,cy+y,w*2+1,1);}}
function line(g,x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);g.fillStyle=c;
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
  for(let n=0;n<200;n++){g.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
function spr(rows,pal){const w=Math.max(...rows.map(r=>r.length)),c=mk(w,rows.length),g=c.getContext('2d');
  rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const k=pal[r[x]];if(k){g.fillStyle=k;g.fillRect(x,y,1,1);}}});return c;}
function flip(c){const o=mk(c.width,c.height),g=o.getContext('2d');g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0);return o;}

/* ---------- tiny 3x5 font ---------- */
const FONT={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',
G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',
N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',
U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',
0:'111101101101111',1:'010110010010111',2:'110001010100111',3:'110001010001110',4:'101101111001001',5:'111100110001110',
6:'011100111101111',7:'111001010010010',8:'111101111101111',9:'111101111001110','+':'000010111010000','/':'001001010100100','!':'010010010000010'};
function txt(g,s,x,y,c){g.fillStyle=c;for(const ch of String(s).toUpperCase()){const f=FONT[ch];if(f)for(let i=0;i<15;i++)if(f[i]==='1')g.fillRect(x+i%3,y+(i/3|0),1,1);x+=4;}}
function txtO(g,s,x,y,c){for(const[a,b]of[[-1,0],[1,0],[0,-1],[0,1]])txt(g,s,x+a,y+b,INK);txt(g,s,x,y,c);}

/* ---------- sprites: characters ---------- */
const BODY={
d:["....oooo....","..oohhhhoo..",".ohhhhhhhho.",".ohhhhhhhho.",".ohHssssHho.",".oHsessesHo.","..osssssso..","...oSSSSo...","..obggggbo..",".obbbbbbbbo.",".osbbbbbbso.",".oobBBBBboo.","..obbbbbbo.."],
u:["....oooo....","..oohhhhoo..",".ohhhhhhhho.",".ohhhhhhhho.",".ohhHhhHhho.",".ohhhhhhhho.","..ohHHHHho..","...oHHHHo...","..obbbbbbo..",".obbbbbbbbo.",".osbbbbbbso.",".oobBBBBboo.","..obbbbbbo.."],
s:["....oooo....","..oohhhhoo..",".ohhhhhhhho.",".ohhhhhhhho.",".ohhhHsssso.",".ohhHssseso.","..ohHsssso..","...oHSSSo...","...obbgbo...","..obbbbbbo..","..obbssbbo..","..oobBBboo..","...obbbbo..."]};
const LEGS={
d:[["..oBBooBBo..","..olloollo..","..ooo..ooo.."],["..oBBooBBo..","..ollooo....","..ooo......."],["..oBBooBBo..","....ooollo..",".......ooo.."]],
s:[["...oBBBBo...","....ollo....","....oooo...."],["...oBBBBo...","..olloollo..","..ooo..ooo.."],["...oBBBBo...","....ollo....","....oooo...."]]};
function human(p){const P=Object.assign({o:INK,h:'#f6cf4a',H:'#c8922a',s:'#f8cfa4',S:'#d99a6c',e:INK,b:'#3b74d8',B:'#274a9c',g:'#f2c24a',l:'#6b4220'},p);
  const f=(b,l)=>spr(b.concat(l),P),o={};
  o.down=LEGS.d.map(l=>f(BODY.d,l));o.up=LEGS.d.map(l=>f(BODY.u,l));o.right=LEGS.s.map(l=>f(BODY.s,l));o.left=o.right.map(flip);return o;}
const SET={
 hero:human({}),
 smith:human({h:'#3a2a22',H:'#241a16',b:'#9a6a3a',B:'#5e3a1a',g:'#e8e2d2',l:'#3a2a22',s:'#e8b088',S:'#c08458'}),
 keeper:human({h:'#c0442e',H:'#8a2c1e',b:'#f2ead8',B:'#b9ad94',g:'#c0442e'}),
 guard:human({h:'#c5cad4',H:'#8f95a3',b:'#c0442e',B:'#8a2c1e',g:'#f2c24a',l:'#44485a'}),
 vil1:human({h:'#7a4a22',H:'#553216',b:'#4aa85a',B:'#2f7a3e',g:'#f2ead8'}),
 vil2:human({h:'#2a2a3a',H:'#1b1420',b:'#b05ac8',B:'#7a3a90',g:'#f2c24a'}),
 goblin:human({s:'#86c44e',S:'#5a9434',h:'#4a6a2a',H:'#32491c',e:'#ff2a2a',b:'#8a5a2b',B:'#5e3a1a',g:'#5e3a1a',l:'#3a2a22'})};
const SLIME=spr(["....oooo....","..ooGGGGoo..",".oGLLGGGGGo.",".oGLGGGGGGo.","oGGGeGGeGGGo","oGGGeGGeGGDo","oGGGGGGGGDDo",".oDDDDDDDDo.","..oooooooo.."],{o:INK,G:'#5fd35a',L:'#c8ffb0',D:'#2f9a45',e:INK});
const COIN=spr([".oooo.","oyYYyo","oyYyyo","oyyydo","oyyddo",".oooo."],{o:'#7a4a10',y:'#ffd24a',Y:'#fff3b0',d:'#e09a20'});
const HEART=spr([".oo.oo.","orwrrro","orrrrro",".orrro.","..oro..","...o..."],{o:INK,r:'#ff3b4a',w:'#ffc0c8'});
const HEARTE=spr([".oo.oo.","okkokko","okkkkko",".okkko.","..oko..","...o..."],{o:INK,k:'#4a3a4a'});
const BUBBLE=spr([".ooooooooo.","owwwwwwwwwo","owwrrwrrwwo","owwrrrrrwwo","owwwrrrwwwo","owwwwrwwwwo",".oooowoooo.","....owo....",".....o....."],{o:INK,w:'#ffffff',r:'#ff3b4a'});
const BANG=spr(["oooo","oyyo","oyyo","oyyo","oyyo","oooo","oyyo","oooo"],{o:INK,y:'#ffd24a'});

/* ---------- sprites: world objects ---------- */
function oak(v){const c=mk(36,44),g=c.getContext('2d'),p=v%2?['#12381f','#1c6632','#2c9644','#56c45a','#a6e36e']:['#143d22','#237038','#39a548','#6fd060','#c8f58a'];
  px(g,15,29,INK,7,13);px(g,16,29,'#8a5a2b',5,13);px(g,19,29,'#5e3a1a',2,13);px(g,14,41,INK,9,2);px(g,15,41,'#6b4220',7,1);
  const bl=[[18,16,12],[10,20,8],[26,20,8],[18,9,8],[11,12,6],[25,12,6]].map(b=>[b[0]+ri(-1,1),b[1]+ri(-1,1),b[2]]);
  bl.forEach(b=>disc(g,b[0],b[1],b[2]+1,p[0]));bl.forEach(b=>disc(g,b[0],b[1],b[2],p[1]));
  bl.forEach(b=>disc(g,b[0]-1,b[1]-1,b[2]-2,p[2]));bl.forEach(b=>{if(b[2]>5)disc(g,b[0]-2,b[1]-3,b[2]-5,p[3]);});
  for(let i=0;i<22;i++){const b=bl[ri(0,5)],a=R()*6.28,r=R()*b[2]*.7,x=b[0]+Math.cos(a)*r,y=b[1]+Math.sin(a)*r;
    if(x+y<b[0]+b[1]-2)px(g,x,y,p[4],2,1);else{px(g,x,y,p[1],2,1);px(g,x+1,y+1,p[1]);}}
  return c;}
function pine(){const c=mk(28,46),g=c.getContext('2d');px(g,11,36,INK,6,10);px(g,12,36,'#7a4a22',4,9);px(g,14,36,'#553216',2,9);
  [[14,1,7,15],[14,9,10,15],[14,18,13,18]].forEach(([cx,ty,hw,h])=>{for(let y=0;y<h;y++){const w=Math.max(1,Math.round(hw*(y+1)/h)+(y%4===3?1:0));
    px(g,cx-w-1,ty+y,'#0f3320',w*2+2,1);px(g,cx-w,ty+y,'#2a8a4a',w,1);px(g,cx,ty+y,'#1a5c34',w,1);if(w>3&&y%3===1)px(g,cx-w+2,ty+y,'#5cc87a',2,1);}
    px(g,cx-hw-1,ty+h,'#0f3320',hw*2+2,1);});return c;}
function bush(){const c=mk(16,12),g=c.getContext('2d');[[5,6,4],[10,6,4],[8,4,4]].forEach(b=>disc(g,b[0],b[1],b[2]+1,'#143d22'));
  [[5,6,4],[10,6,4],[8,4,4]].forEach(b=>disc(g,b[0],b[1],b[2],'#237038'));[[5,5,2],[10,5,2],[8,3,2]].forEach(b=>disc(g,b[0]-1,b[1],b[2],'#56c45a'));
  if(R()<.5){px(g,4,4,'#ff5a6a');px(g,10,7,'#ff5a6a');px(g,8,2,'#ffe14a');}return c;}
function barrel(){const c=mk(11,14),g=c.getContext('2d');px(g,1,0,INK,9,14);px(g,0,2,INK,11,10);px(g,1,1,'#b0783c',9,12);px(g,2,1,'#d09a58',2,12);px(g,8,1,'#7a4f24',2,12);
  px(g,1,1,'#6b4220',9,1);px(g,1,3,'#5a5f6a',9,2);px(g,1,9,'#5a5f6a',9,2);px(g,2,3,'#9aa0aa',2,1);px(g,2,9,'#9aa0aa',2,1);return c;}
function crate(){const c=mk(12,12),g=c.getContext('2d');px(g,0,0,INK,12,12);px(g,1,1,'#c08a4a',10,10);px(g,1,1,'#e0b070',10,1);px(g,1,10,'#8a5a2b',10,1);
  line(g,1,1,10,10,'#8a5a2b');line(g,10,1,1,10,'#8a5a2b');px(g,1,1,'#8a5a2b',1,10);px(g,10,1,'#8a5a2b',1,10);return c;}
function anvil(){return spr(["oooooooooooo..","oLLLLLLLLLLLoo","ommmmmmmmmmmmo",".oooommmmoooo.","....ommmo.....","...oommmoo....","..odddddddo...","..ooooooooo..."],{o:INK,L:'#aeb6c4',m:'#6a7284',d:'#444a5a'});}
function well(){const c=mk(26,30),g=c.getContext('2d');px(g,3,6,INK,3,18);px(g,20,6,INK,3,18);px(g,4,6,'#8a5a2b',1,18);px(g,21,6,'#8a5a2b',1,18);
  for(let y=0;y<8;y++){const w=4+y*1.4;px(g,13-w,y,y<2?'#e8684a':y<6?'#d0432f':'#a82f22',w*2,1);px(g,13-w,y,INK);px(g,13+w-1,y,INK);}px(g,1,8,INK,24,1);
  disc(g,13,22,11,INK,.5);px(g,2,22,INK,23,6);disc(g,13,27,11,INK,.3);disc(g,13,22,10,'#b4b8c0',.48);px(g,3,22,'#8d9199',21,5);disc(g,13,26,10,'#8d9199',.3);
  for(let x=4;x<23;x+=5)px(g,x,23,'#6b6f7a',1,5);px(g,3,25,'#6b6f7a',21,1);disc(g,13,22,7,'#1f4f9a',.42);px(g,10,21,'#6fb8f5',3,1);line(g,13,8,13,20,'#3a2a1a');return c;}
function lamp(){const c=mk(8,26),g=c.getContext('2d');px(g,3,7,INK,3,19);px(g,4,7,'#4a4d58',1,18);px(g,2,24,INK,5,2);px(g,1,0,INK,7,8);px(g,2,1,'#ffd66b',5,6);px(g,3,2,'#fff3b0',3,3);px(g,1,0,'#4a4d58',7,1);px(g,4,1,INK,1,6);return c;}
function fence(){const c=mk(16,12),g=c.getContext('2d');px(g,0,3,INK,16,4);px(g,0,4,'#d0a060',16,1);px(g,0,5,'#a87840',16,1);px(g,0,8,INK,16,3);px(g,0,9,'#a87840',16,1);
  [1,9].forEach(x=>{px(g,x,0,INK,5,12);px(g,x+1,1,'#e0b878',2,10);px(g,x+3,1,'#a87840',1,10);});return c;}
function table(){const c=mk(30,18),g=c.getContext('2d');px(g,3,8,INK,4,10);px(g,23,8,INK,4,10);px(g,4,9,'#7a4f24',2,8);px(g,24,9,'#7a4f24',2,8);
  px(g,0,3,INK,30,7);px(g,1,4,'#c08a4a',28,3);px(g,1,4,'#e0b070',28,1);px(g,1,7,'#8a5a2b',28,2);
  [[6,0],[19,0]].forEach(([x,y])=>{px(g,x,y,INK,6,6);px(g,x+1,y+1,'#fff',4,1);px(g,x+1,y+2,'#e0a020',4,3);px(g,x+6,y+2,INK,2,3);px(g,x+6,y+3,'#c8c8d0',1,1);});return c;}
function cart(){const c=mk(34,24),g=c.getContext('2d');disc(g,12,6,6,'#b07810');disc(g,20,5,6,'#b07810');disc(g,12,5,5,'#ffd24a');disc(g,20,4,5,'#ffd24a');disc(g,16,3,4,'#ffe880');
  for(let i=0;i<9;i++)px(g,7+ri(0,17),1+ri(0,6),'#fff8d0');line(g,24,-2,19,6,INK);line(g,25,-2,20,6,'#dfe6f0');
  px(g,2,8,INK,28,10);px(g,3,9,'#b0783c',26,8);px(g,3,9,'#d09a58',26,1);px(g,3,13,'#7a4f24',26,1);for(let x=8;x<28;x+=6)px(g,x,9,'#7a4f24',1,8);
  line(g,30,12,33,9,INK);disc(g,9,19,4,INK);disc(g,9,19,3,'#8a5a2b');disc(g,9,19,1,'#4a4d58');disc(g,24,19,4,INK);disc(g,24,19,3,'#8a5a2b');disc(g,24,19,1,'#4a4d58');return c;}

/* ---------- physics ---------- */
const GRAV=900;
function moveEnt(e,dt){
  let nx=e.x+e.vx*dt;const r0=Math.floor((e.y-e.h)/T),r1=Math.floor((e.y-1)/T);e.hitWall=0;
  if(e.vx>0){const c=Math.floor((nx+e.hw)/T);for(let r=r0;r<=r1;r++)if(solid(c,r)){nx=c*T-e.hw-.01;e.vx=0;e.hitWall=1;break;}}
  else if(e.vx<0){const c=Math.floor((nx-e.hw)/T);for(let r=r0;r<=r1;r++)if(solid(c,r)){nx=(c+1)*T+e.hw+.01;e.vx=0;e.hitWall=-1;break;}}
  e.x=clamp(nx,e.hw,PW-e.hw);
  e.vy=Math.min(420,e.vy+GRAV*dt);let ny=e.y+e.vy*dt;e.ground=false;
  const c0=Math.floor((e.x-e.hw)/T),c1=Math.floor((e.x+e.hw)/T);
  if(e.vy>=0){const r=Math.floor(ny/T);for(let c=c0;c<=c1;c++){const t=tileAt(c,r);if(t===1||t===2||(t===3&&e.y<=r*T+.01&&!(e.drop>0))){ny=r*T;e.vy=0;e.ground=true;break;}}}
  else{const r=Math.floor((ny-e.h)/T);for(let c=c0;c<=c1;c++)if(solid(c,r)){ny=(r+1)*T+e.h;e.vy=0;break;}}
  e.y=ny;}
const floorAhead=(e,d)=>{const t=tileAt(Math.floor((e.x+e.dir*d)/T),Math.floor((e.y+1)/T));return t===1||t===2||t===3;};
const wallAhead=(e,d)=>solid(Math.floor((e.x+e.dir*d)/T),Math.floor((e.y-2)/T));

    if(e.hp<=0){burst(e.x,e.y-e.h/2,e.type==='slime'?'#5fd35a':'#86c44e',big?40:14);const n=big?12:e.type==='slime'?2:3;

function enemyStep(dt){

      if(e.stun<=0){
        if(e.type==='slime'){if(e.ground){e.vx=0;e.t-=dt;if(e.t<=0){if(seen)e.dir=dx>0?1:-1;else if(Math.abs(e.x-e.hx)>44)e.dir=e.x>e.hx?-1:1;
            if(!floorAhead(e,20)||wallAhead(e,12))e.dir=-e.dir;if(floorAhead(e,20)&&!wallAhead(e,12)){e.vy=-170;e.vx=e.dir*46;}e.t=.6+Math.random()*.5;}}}
        else if(e.ground){const big=e.type==='chief';if(seen||(!demo&&big&&Math.abs(dx)<150&&Math.abs(dy)<40)){e.dir=dx>0?1:-1;const ok=floorAhead(e,10)&&!wallAhead(e,e.hw+4)&&Math.abs(dx)>3;e.vx=ok?e.dir*(big?52:62):0;}
          else{if(!floorAhead(e,10)||wallAhead(e,e.hw+4)||(Math.abs(e.x-e.hx)>56&&(e.x-e.hx)*e.dir>0))e.dir=-e.dir;e.vx=e.dir*30;}
          if(Math.abs(e.vx)>1)e.walk+=dt*8;}}
      moveEnt(e,dt);if(e.y>WATERY+12){e.x=e.hx;e.y=gy(e.hx);e.vx=e.vy=0;}
      if(!demo&&Math.abs(dx)<e.hw+4&&pl.y>e.y-e.h&&pl.y-pl.h<e.y)hurt(e.x);}
}

  cam.x=clamp(pl.x-VW/2,0,Math.max(0,PW-VW));cam.y=PH>VH?clamp(camY-VH*.76,0,PH-VH):PH-VH;for(const k in keys)keys[k]=false;}
function demoStep(dt){demo.t+=dt;if(demo.t>=DEMO_T){demo.i++;demo.t=0;if(demo.i>=AREAS.length){stopDemo();return;}fade=.6;demoCap();}
  const A=AREAS[demo.i],p=demo.t/DEMO_T,x=A[1]+(A[2]-A[1])*p,last=demo.i===AREAS.length-1;
  cam.x=clamp(x-VW/2,0,Math.max(0,PW-VW));cam.y=PH>VH?clamp(last?A[3]-VH+46:A[3]-VH*.76,0,PH-VH):PH-VH;enemyStep(dt);}
$('demo').addEventListener('click',e=>{e.stopPropagation();e.currentTarget.blur();demo?stopDemo():startDemo();});
$('stage').addEventListener('click',()=>{if(demo)stopDemo();});

/* ---------- update ---------- */
let lastQ='';
function update(dt){time+=dt;
  let ix=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0)+jx,down=!!(keys.arrowdown||keys.s)||jy>.6,jh=!!(keys[' ']||keys.w||keys.arrowup)||tJump;
  try{const gp=navigator.getGamepads&&navigator.getGamepads()[0];if(gp){if(Math.abs(gp.axes[0])>.3)ix+=gp.axes[0];if(gp.axes[1]>.6)down=true;const B=i=>gp.buttons[i]&&gp.buttons[i].pressed;
    if(B(14))ix-=1;if(B(15))ix+=1;if(B(13))down=true;const a=B(0),x=B(2)||B(1);if(a&&!gpA)jumpQ=true;if(x&&!gpX)actQ=true;gpA=a;gpX=x;if(a)jh=true;}}catch(e){}
  ix=clamp(ix,-1,1);if(Math.abs(ix)<.25)ix=0;
  if(fade>0)fade=Math.max(0,fade-dt*1.4);if(bubble>0)bubble-=dt;
  if(demo){if(jumpQ||actQ||ix)stopDemo();else demoStep(dt);jumpQ=actQ=false;}
  else if(dlg){if(jumpQ||actQ)advance(true);jumpQ=actQ=false;}
  else{
    if(actQ){actQ=false;const n=nearNpc();if(n&&pl.ground)talk(n);else attack();}
    pl.lock-=dt;pl.atk-=dt;pl.cd-=dt;pl.inv-=dt;pl.jb-=dt;pl.ct-=dt;pl.drop-=dt;
    if(jumpQ){jumpQ=false;if(down&&pl.ground&&tileAt(Math.floor(pl.x/T),Math.floor((pl.y+1)/T))===3)pl.drop=.22;else pl.jb=.12;}
    if(pl.lock<=0){pl.vx+=(ix*100-pl.vx)*Math.min(1,dt*(pl.ground?16:9));if(ix){pl.dir=ix>0?1:-1;moved=true;}}
    if(pl.ground)pl.ct=.1;
    if(pl.jb>0&&pl.ct>0){pl.vy=-290;pl.jb=0;pl.ct=0;sfx('jump');}
    if(!jh&&pl.vy<-110)pl.vy=-110;
    moveEnt(pl,dt);
    if(pl.ground&&Math.abs(pl.vx)>12)pl.walk+=dt*10;else pl.walk=0;
    const pc=Math.floor(pl.x/T),pr=Math.floor((pl.y+1)/T);
    if(pl.ground&&solid(pc,pr)&&solid(Math.floor((pl.x-9)/T),pr)&&solid(Math.floor((pl.x+9)/T),pr)){pl.sx=pl.x;pl.sy=pl.y;}
    if(pl.y>WATERY+10)fell();
    if(S.stage===0&&pl.x>700){S.stage=1;save();}
    /* checkpoints */
    let near=-1;CPS.forEach((x,i)=>{if(Math.abs(pl.x-x)<22&&Math.abs(pl.y-gy(x))<24)near=i;});
    if(near>0&&near!==cpNear){if(S.cp!==near){S.cp=near;save();floats.push({x:pl.x,y:pl.y-26,s:'CHECKPOINT',t:1.6,c:'#ffffff'});}if(pl.hp<pl.max){pl.hp=pl.max;sfx('heal');bubble=1.4;}}
    cpNear=near;
    /* castle gate */
    if(Math.abs(pl.x-CASX)>30)gateArmed=true;
    if(S.chief&&gateArmed&&pl.ground&&Math.abs(pl.x-CASX)<10){gateArmed=false;const first=S.stage<2;S.stage=2;save();sfx('up');
      say('The King',first?['Welcome, hero of Embervale!','Your blade and your courage are just what this kingdom needs.','Chapter 1 complete. Bigger adventures lie ahead.','Start the story over?']:['The kingdom is safe for now, hero.','Start the story over?'],
        y=>{if(!y){try{localStorage.removeItem(KEY);}catch(e){}Object.assign(S,{stage:0,coins:0,sword:1,cp:0,chief:false});spawnAll();toCp();fade=1;}},['Keep exploring','New game']);}
    enemyStep(dt);
    for(let i=coins.length-1;i>=0;i--){const c=coins[i];if(Math.abs(c.x-pl.x)<9&&Math.abs(c.y-(pl.y-7))<12){coins.splice(i,1);gain(1);parts.push({x:c.x,y:c.y,vx:0,vy:-40,g:0,t:.25,c:'#fff3b0'});}}
    for(let i=picks.length-1;i>=0;i--){const p=picks[i];p.t+=dt;p.vy+=600*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y>p.gy){p.y=p.gy;p.vy*=-.45;p.vx*=.6;}
      const dx=pl.x-p.x,dy=pl.y-7-p.y,d=Math.hypot(dx,dy)||1;if(p.t>.3&&d<36){p.x+=dx/d*150*dt;p.y+=dy/d*150*dt;p.gy=Math.max(p.gy,p.y);}
      if(p.t>.3&&d<9){picks.splice(i,1);if(p.type==='coin')gain(1);else{pl.hp=Math.min(pl.max,pl.hp+1);sfx('heal');bubble=1;}save();}else if(p.t>20)picks.splice(i,1);}
  }
  /* ambient */
  if(Math.random()<dt*5)parts.push({x:222+Math.random()*4,y:BASE*T-80,vx:5+Math.random()*4,vy:-12,g:-2,t:2.2,c:Math.random()<.5?'#c8ccd4':'#9aa0aa',sm:1});
  if(Math.random()<dt*3)parts.push({x:528+Math.random()*4,y:BASE*T-80,vx:5,vy:-11,g:-2,t:2,c:'#d8dce4',sm:1});
  if(Math.random()<dt*40)parts.push({x:1446+Math.random()*52,y:WATERY-2+Math.random()*4,vx:(Math.random()-.5)*26,vy:-22,g:70,t:.5,c:'#ffffff'});
  if(Math.random()<dt*14)parts.push({x:2004+Math.random()*8,y:314,vx:(Math.random()-.5)*10,vy:-26-Math.random()*20,g:-10,t:.6,c:Math.random()<.5?'#ffd24a':'#ff8a2a'});
  if(Math.floor(time/.8)!==Math.floor((time-dt)/.8))for(const ax of[272,2062])for(let i=0;i<5;i++)parts.push({x:ax,y:gy(ax)-9,vx:(Math.random()-.5)*60,vy:-30-Math.random()*40,g:160,t:.35,c:i%2?'#ffd24a':'#ff8a2a'});
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;if(p.t<=0)parts.splice(i,1);}
  for(let i=floats.length-1;i>=0;i--){floats[i].t-=dt;floats[i].y-=dt*14;if(floats[i].t<=0)floats.splice(i,1);}
  /* camera */
  if(!demo){
  if(pl.ground||pl.y>camY)camY=pl.y;look+=(pl.dir*VW*.12-look)*Math.min(1,dt*2.5);
  const tx=pl.x-VW/2+look,ty=pl.x>207*T?camY-VH+46:camY-VH*.76;
  cam.x+=(tx-cam.x)*Math.min(1,dt*9);cam.y+=(ty-cam.y)*Math.min(1,dt*5);
  cam.x=clamp(cam.x,0,Math.max(0,PW-VW));cam.y=PH>VH?clamp(cam.y,0,PH-VH):PH-VH;
  }
  const q=questText()+(moved?'':(document.body.classList.contains('touch')?'<br>Hold the arrows to run. Sword also talks.':'<br>Arrows or A/D to run. Space to jump. X to swing and talk.'));
  if(q!==lastQ){lastQ=q;$('quest').innerHTML=q;}
}

/* ---------- render ---------- */
const cv=$('game'),ctx=cv.getContext('2d');let VW=320,VH=180,SC=3;
function resize(){const W=$('wrap').getBoundingClientRect(),port=document.body.classList.contains('touch')&&W.height>W.width*1.15;
  document.body.classList.toggle('portrait',port);const w=W.width||innerWidth,h=port?Math.min(Math.round(w*.74),Math.round(W.height*.5)):(W.height||innerHeight);
  $('stage').style.height=port?h+'px':'';$('wrap').style.setProperty('--sh',h+'px');
  const dpr=window.devicePixelRatio||1,q=port?w/225:Math.min(Math.sqrt(w*h)/240,w/230);SC=Math.min(8,Math.max(1,Math.round(q*dpr))/dpr);
  VW=Math.ceil(w/SC);VH=Math.ceil(h/SC);cv.width=VW;cv.height=VH;cv.style.width=VW*SC+'px';cv.style.height=VH*SC+'px';ctx.imageSmoothingEnabled=false;
  HUDX=4+Math.ceil((parseFloat(getComputedStyle($('probe')).paddingLeft)||0)/SC);$('quest').style.top=(22*SC+6)+'px';}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,250));resize();
cam.x=clamp(pl.x-VW/2,0,Math.max(0,PW-VW));cam.y=PH>VH?clamp(pl.y-VH*.76,0,PH-VH):PH-VH;

function drawHuman(g,set,x,y,dir,f,sc){const im=set[dir][f];if(sc)g.drawImage(im,Math.round(x-12),Math.round(y-32),24,32);else g.drawImage(im,Math.round(x-6),Math.round(y-16));}
function drawSword(g,x,y,dir,p,lvl){const sw=p!=null,len=(sw?10:7)+lvl;let a=sw?-1.6+2.6*p:-1.05;const A=v=>dir>0?v:Math.PI-v,hx=x+dir*4,hy=y-6,tx=hx+Math.cos(A(a))*len,ty=hy+Math.sin(A(a))*len;
  if(sw){g.globalAlpha=.7;for(let k=1;k<=6;k++){const b=A(a-k*.2);px(g,hx+Math.cos(b)*len,hy+Math.sin(b)*len,k<3?'#ffffff':SWC[lvl],2,2);}g.globalAlpha=1;}
  line(g,hx+1,hy,tx+1,ty,INK);line(g,hx,hy+1,tx,ty+1,INK);line(g,hx,hy,tx,ty,SWC[lvl]);px(g,hx-1,hy-1,'#8a5a2b',2,2);px(g,tx,ty,'#ffffff');}
function tileX(g,img,off,y){off=((off%img.width)+img.width)%img.width;for(let x=-off;x<VW;x+=img.width)g.drawImage(img,Math.round(x),y);}

function render(){const g=ctx,cx=Math.round(cam.x),cy=Math.round(cam.y),t=time,hz=Math.round(VH*.7-cy*.1);
  g.fillStyle='#2a66d8';g.fillRect(0,0,VW,VH);for(let x=0;x<VW;x+=64)g.drawImage(SKYC,x,hz-104);g.fillStyle='#b4defc';g.fillRect(0,hz+8,VW,VH);
  tileX(g,CLOUD,cx*.04+t*4,hz-150);tileX(g,CLOUD,cx*.06+t*6+200,hz-108);
  tileX(g,MTN,cx*.08,hz-98);tileX(g,HILLS,cx*.22,hz-52);g.fillStyle='#3a9a58';g.fillRect(0,hz+32,VW,VH);
  g.drawImage(FARC,Math.round(VW*.72-cx*.22),hz-104);
  const fy=BASE*T-cy-104;if(fy<VH){tileX(g,BGF,cx*.55,fy);g.fillStyle='#255f54';g.fillRect(0,fy+116,VW,VH);}
  for(const o of back)if(o.x<cx+VW&&o.x+o.img.width>cx&&o.y<cy+VH&&o.y+o.img.height>cy)g.drawImage(o.img,o.x-cx,o.y-cy);
  /* waterfall */
  if(cx<1500&&cx+VW>1444){const x0=1448-cx,y0=124-cy,H=WATERY-124;px(g,x0-2,y0,'#e8f6ff',52,3);
    for(let i=0;i<48;i++){const e=i<2||i>45;px(g,x0+i,y0+3,e?'#256bc4':(i%5===0?'#3a8ae6':'#4fa3f0'),1,H);const o=(t*80+hash(i,1)*30)%14;
      for(let y=-14+o;y<H;y+=14){const a=Math.max(0,y),b=Math.min(H,y+5+((i*7)%4));if(b>a)px(g,x0+i,y0+3+a,i%3?'#bfe4ff':'#ffffff',1,b-a);}}}
  /* water */
  const wf=WATERF[Math.floor(t*3)%4],c0=Math.max(0,cx>>4),c1=Math.min(LW-1,(cx+VW)>>4);
  for(let c=c0;c<=c1;c++)if(lv[22*LW+c]===4){const x=c*T-cx;for(let y=WATERY;y<PH;y+=16)g.drawImage(wf,(c&1)*16,((y>>4)&1)*16,16,16,x,y-cy,16,16);
    px(g,x,WATERY-cy+Math.round(Math.sin(t*3+c)*.6),'#bfe4ff',16,1);px(g,x+((c*5+Math.floor(t*4))%12),WATERY-cy+2,'#e8f6ff',3,1);}
  g.drawImage(LEVEL,-cx,-cy);
  /* campfire, flags */
  {const x=2008-cx,y=316-cy,f=Math.sin(t*14)*1.2;disc(g,x,y-3,4,'#ff8a2a');disc(g,x+f*.5,y-6,3,'#ffb03a');disc(g,x,y-3,2,'#ffe07a');px(g,x-1+f,y-10,'#ffd24a',2,3);
    g.globalAlpha=.14+Math.sin(t*9)*.03;disc(g,x,y-4,16,'#ffe07a');g.globalAlpha=1;}
  for(const[fx,fy2]of flags){const x=CASX-80+fx-cx,y=CASY-150+fy2-cy,w=Math.floor(t*4+fx)%2;px(g,x,y+w,'#e03a3a',3,3);px(g,x+3,y+1-w,'#e03a3a',3,3);px(g,x+5,y+1-w,'#a82f22',1,3);}
  g.globalAlpha=.16+Math.sin(t*9)*.03;for(const x of[140,344,436,624])disc(g,x-cx,BASE*T-22-cy,8,'#ffe07a');g.globalAlpha=1;
  /* coins */
  for(const c of coins){if(c.x<cx-8||c.x>cx+VW+8)continue;const w=[6,4,2,4][Math.floor(t*7+c.x*.05)%4];g.drawImage(COIN,Math.round(c.x-cx-w/2),Math.round(c.y-cy-3+Math.sin(t*3+c.x*.1)*1.5),w,6);}
  for(const n of npcs){const x=n.x-cx,y=n.y-cy;if(x<-20||x>VW+20)continue;drawHuman(g,n.set,x,y,n.dir,0);
    if(n.id==='smith'||n.id==='smith2'){const p=(t/.8)%1,a=p<.75?-1.9+p*.6:-1.45+(p-.75)*6.4,hx=x+5,hy=y-7,ex=hx+Math.cos(a)*8,ey=hy+Math.sin(a)*8;line(g,hx,hy,ex,ey,'#8a5a2b');px(g,ex-2,ey-2,INK,5,4);px(g,ex-1,ey-1,'#9aa0aa',3,2);}
    if(marker(n))g.drawImage(BANG,Math.round(x-2),Math.round(y-27+Math.sin(t*5)*1.5));}
  for(const e of enemies){const x=e.x-cx,y=e.y-cy;if(x<-30||x>VW+30||(e.fl>0&&Math.floor(t*30)%2))continue;
    if(e.type==='slime'){const sq=e.ground?Math.round(Math.sin(t*6+e.hx)*.6+.5):-1;g.drawImage(SLIME,Math.round(x-6-sq),Math.round(y-9+sq),12+sq*2,9-sq);}
    else{const f=Math.abs(e.vx)>1?Math.floor(e.walk)%2:0;drawHuman(g,SET.goblin,x,y,e.dir>0?'right':'left',f,e.type==='chief');
      if(e.type==='chief'){px(g,x-6,y-36,INK,13,5);px(g,x-5,y-35,'#ffd24a',11,3);px(g,x-5,y-37,'#ffd24a',2,2);px(g,x-1,y-38,'#ffd24a',3,3);px(g,x+4,y-37,'#ffd24a',2,2);
        px(g,x-10,y-44,INK,21,4);px(g,x-9,y-43,'#4a3a4a',19,2);px(g,x-9,y-43,'#ff3b4a',Math.max(0,Math.round(19*e.hp/14)),2);}}}
  for(const p of picks){const x=p.x-cx,y=p.y-cy;if(p.type==='coin'){const w=[6,4,2,4][Math.floor(p.t*8)%4];g.drawImage(COIN,Math.round(x-w/2),Math.round(y-6),w,6);}else g.drawImage(HEART,Math.round(x-3),Math.round(y-7));}
  if(!(pl.inv>0&&Math.floor(t*20)%2)){const x=pl.x-cx,y=pl.y-cy,f=!pl.ground?1:pl.walk?Math.floor(pl.walk)%2:0,sw=pl.atk>0?1-pl.atk/.2:null;
    drawHuman(g,SET.hero,x,y,pl.dir>0?'right':'left',f);drawSword(g,x,y,pl.dir,sw,S.sword);if(bubble>0)g.drawImage(BUBBLE,Math.round(x+2),Math.round(y-28));}
  for(const o of front)if(o.x<cx+VW&&o.x+o.img.width>cx)g.drawImage(o.img,o.x-cx,o.y-cy);
  for(const p of parts){if(p.sm){g.globalAlpha=Math.min(.6,p.t*.4);px(g,p.x-cx,p.y-cy,p.c,2,2);g.globalAlpha=1;}else px(g,p.x-cx,p.y-cy,p.c);}
  for(const f of floats)txtO(g,f.s,Math.round(f.x-cx-f.s.length*2),Math.round(f.y-cy),f.c);
  /* HUD */
  for(let i=0;i<pl.max;i++)g.drawImage(i<pl.hp?HEART:HEARTE,HUDX+i*8,4);
  g.drawImage(COIN,HUDX,13);txtO(g,S.coins,HUDX+8,14,'#ffd24a');
  const gx=HUDX+10+String(S.coins).length*4+6;line(g,gx,18,gx+5,13,INK);line(g,gx+1,18,gx+6,13,SWC[S.sword]);txtO(g,'LV'+S.sword,gx+10,14,'#ffffff');
  if(fade>0){g.globalAlpha=Math.min(1,fade);g.fillStyle='#000';g.fillRect(0,0,VW,VH);g.globalAlpha=1;}
}
let last=0;
function frame(ms){const dt=Math.min(.033,(ms-last)/1000||0);last=ms;update(dt);render();requestAnimationFrame(frame);}
window.__g={startDemo,stopDemo,get demo(){return demo;},S,pl,cam,update,render,enemies,coins,keys,npcs,gh,T,jump:()=>{jumpQ=true;},act:()=>{actQ=true;},get dlg(){return dlg;},setCamY:v=>{camY=v;}};
requestAnimationFrame(frame);
})();
</script>
