<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Embervale</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1b2a;--ink:#1b1420;--paper:#f6e7c1;--gold:#ffd24a;--wood:#6b4220;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b2a}}
:root[data-theme="dark"]{--bg:#0d1b2a}
html,body{height:100%;margin:0}
body{background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  font-family:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace}
#wrap{position:relative;width:100%;height:100%;overflow:hidden}
canvas{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
#quest{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));top:54px;right:10px;color:#fff;font-size:10px;line-height:1.5;
  text-shadow:1px 1px 0 var(--ink),-1px 1px 0 var(--ink),1px -1px 0 var(--ink),-1px -1px 0 var(--ink),0 2px 0 var(--ink);pointer-events:none}
#dlg{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));
  box-sizing:border-box;background:var(--paper);color:var(--ink);border:4px solid var(--ink);
  box-shadow:inset 0 0 0 3px var(--wood),0 6px 0 rgba(0,0,0,.35);padding:14px 16px;font-size:11px;line-height:1.7;cursor:pointer}
#dlg[hidden]{display:none}
#dname{color:#a82f22;margin-bottom:6px}
#dbtn{margin-top:10px;display:flex;gap:10px;justify-content:flex-end;align-items:center;font-size:9px;color:var(--wood)}
#dbtn button{font:inherit;font-size:10px;padding:8px 10px;border:3px solid var(--ink);background:var(--gold);color:var(--ink);cursor:pointer}
#dbtn button.no{background:#d9c9a0}
#dbtn button:focus-visible{outline:3px solid #3b74d8}
#stage{position:relative;width:100%;height:100%;overflow:hidden}
#pad{display:none}
body.touch #pad{display:block;position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none}
body.touch #pad>*{pointer-events:auto;position:absolute}
#dir{left:calc(16px + env(safe-area-inset-left,0px));bottom:24px;width:168px;height:84px;display:flex;gap:8px}
#dir span{flex:1;display:flex;align-items:center;justify-content:center;border:4px solid var(--ink);border-radius:18px;
  background:rgba(246,231,193,.82);font:28px/1 system-ui,sans-serif;color:var(--ink)}
#dir.l #bl,#dir.r #br{background:var(--gold)}
.pad{border-radius:50%;border:4px solid var(--ink);font:inherit;color:var(--ink);padding:0}
.pad.on{filter:brightness(.82)}
#jump{right:calc(16px + env(safe-area-inset-right,0px));bottom:24px;width:86px;height:86px;background:rgba(255,210,74,.9);font-size:11px}
#atk{right:calc(112px + env(safe-area-inset-right,0px));bottom:52px;width:70px;height:70px;background:rgba(223,230,240,.9);font-size:9px}
body.touch #dlg{bottom:auto;top:10px}
body.portrait #wrap{display:flex;flex-direction:column}
body.portrait #stage{flex:none}
body.portrait #pad{position:relative;flex:1;pointer-events:auto;background:#16263a;border-top:4px solid var(--ink);
  box-shadow:inset 0 4px 0 #24405e}
body.portrait #dir,body.portrait #jump{bottom:auto;top:46%}
body.portrait #atk{bottom:auto;top:calc(46% - 22px)}
body.portrait #dlg{top:calc(var(--sh,50%) + 14px)}
#menuBtn{position:absolute;top:8px;right:calc(8px + env(safe-area-inset-right,0px));font:inherit;font-size:9px;padding:8px 10px;
  border:3px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.35);cursor:pointer}
#cap{position:absolute;left:0;right:0;top:20%;text-align:center;color:#fff;font-size:16px;line-height:1.8;pointer-events:none;
  text-shadow:2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 4px 0 var(--ink)}
#cap small{display:block;font-size:9px;color:var(--gold)}
#cap[hidden]{display:none}
body.demoing:not(.portrait) #pad{visibility:hidden}
#menu{position:absolute;left:0;top:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(13,27,42,.72);overflow:auto}
#menu[hidden]{display:none}
#menu .box{width:min(340px,calc(100% - 32px));box-sizing:border-box;margin:auto;background:var(--paper);color:var(--ink);border:4px solid var(--ink);
  box-shadow:inset 0 0 0 3px var(--wood),0 6px 0 rgba(0,0,0,.35);padding:16px;text-align:center}
#menu h1{font-size:20px;margin:4px 0 6px;color:#a82f22;text-shadow:2px 2px 0 var(--gold)}
#menu p{font-size:8px;margin:0 0 12px;color:var(--wood);line-height:1.6}
#menu button{display:block;width:100%;box-sizing:border-box;font:inherit;font-size:10px;line-height:1.5;padding:10px 8px;margin:6px 0;border:3px solid var(--ink);background:#e9d9ae;color:var(--ink);cursor:pointer}
#menu button#mplay,#menu button.cur{background:var(--gold)}
#menu button:disabled{opacity:.45;cursor:default}
#menu button:focus-visible{outline:3px solid #3b74d8}
#menu .row{display:flex;gap:8px}#menu .row button{margin:6px 0}
#probe{position:absolute;visibility:hidden;padding-left:env(safe-area-inset-left,0px)}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="game"></canvas><div id="quest"></div><div id="cap" hidden></div><button id="menuBtn" aria-label="Open menu">Menu</button></div>
  <div id="pad">
    <div id="dir" role="group" aria-label="Run left or right"><span id="bl">&#9664;</span><span id="br">&#9654;</span></div>
    <button id="atk" class="pad" aria-label="Sword">Sword</button>
    <button id="jump" class="pad" aria-label="Jump">Jump</button>
  </div>
  <div id="dlg" hidden><div id="dname"></div><div id="dtext"></div><div id="dbtn"></div></div>
  <div id="menu" hidden><div class="box">
    <h1>EMBERVALE</h1><p>A pixel adventure in three chapters</p>
    <button id="mplay">Play</button>
    <div id="mch"></div>
    <div class="row"><button id="mdemo">Area demo</button><button id="mmusic">Music: on</button></div>
    <button id="mnew">New game</button>
  </div></div>
  <div id="probe"></div>
</div>
<script>
(()=>{'use strict';
const T=16,INK='#1b1420';
const $=id=>document.getElementById(id);
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
function rng(s){return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=rng(20261002),ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const hash=(x,y)=>{let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296;};
const sm=t=>t*t*(3-2*t);
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),fx=sm(x-xi),fy=sm(y-yi),a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy;}
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const hex=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------- pixel helpers ---------- */
const px=(g,x,y,c,w=1,h=1)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h);};
function disc(g,cx,cy,r,c,sq=1){g.fillStyle=c;cx=Math.round(cx);cy=Math.round(cy);const ry=Math.max(1,Math.round(r*sq));
  for(let y=-ry;y<=ry;y++){const w=Math.round(r*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry+.6))));g.fillRect(cx-w,cy+y,w*2+1,1);}}
function line(g,x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);g.fillStyle=c;
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
  for(let n=0;n<200;n++){g.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
function spr(rows,pal){const w=Math.max(...rows.map(r=>r.length)),c=mk(w,rows.length),g=c.getContext('2d');
  rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const k=pal[r[x]];if(k){g.fillStyle=k;g.fillRect(x,y,1,1);}}});return c;}
function flip(c){const o=mk(c.width,c.height),g=o.getContext('2d');g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0);return o;}

/* ---------- tiny 3x5 font ---------- */
const FONT={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',
G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',
N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',
U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',
0:'111101101101111',1:'010110010010111',2:'110001010100111',3:'110001010001110',4:'101101111001001',5:'111100110001110',
6:'011100111101111',7:'111001010010010',8:'111101111101111',9:'111101111001110','+':'000010111010000','/':'001001010100100','!':'010010010000010'};
function txt(g,s,x,y,c){g.fillStyle=c;for(const ch of String(s).toUpperCase()){const f=FONT[ch];if(f)for(let i=0;i<15;i++)if(f[i]==='1')g.fillRect(x+i%3,y+(i/3|0),1,1);x+=4;}}
function txtO(g,s,x,y,c){for(const[a,b]of[[-1,0],[1,0],[0,-1],[0,1]])txt(g,s,x+a,y+b,INK);txt(g,s,x,y,c);}

/* ---------- sprites: characters ---------- */
const BODY={
d:["....oooo....","..oohhhhoo..",".ohhhhhhhho.",".ohhhhhhhho.",".ohHssssHho.",".oHsessesHo.","..osssssso..","...oSSSSo...","..obggggbo..",".obbbbbbbbo.",".osbbbbbbso.",".oobBBBBboo.","..obbbbbbo.."],
u:["....oooo....","..oohhhhoo..",".ohhhhhhhho.",".ohhhhhhhho.",".ohhHhhHhho.",".ohhhhhhhho.","..ohHHHHho..","...oHHHHo...","..obbbbbbo..",".obbbbbbbbo.",".osbbbbbbso.",".oobBBBBboo.","..obbbbbbo.."],
s:["....oooo....","..oohhhhoo..",".ohhhhhhhho.",".ohhhhhhhho.",".ohhhHsssso.",".ohhHssseso.","..ohHsssso..","...oHSSSo...","...obbgbo...","..obbbbbbo..","..obbssbbo..","..oobBBboo..","...obbbbo..."]};
const LEGS={
d:[["..oBBooBBo..","..olloollo..","..ooo..ooo.."],["..oBBooBBo..","..ollooo....","..ooo......."],["..oBBooBBo..","....ooollo..",".......ooo.."]],
s:[["...oBBBBo...","....ollo....","....oooo...."],["...oBBBBo...","..olloollo..","..ooo..ooo.."],["...oBBBBo...","....ollo....","....oooo...."]]};
function human(p){const P=Object.assign({o:INK,h:'#f6cf4a',H:'#c8922a',s:'#f8cfa4',S:'#d99a6c',e:INK,b:'#3b74d8',B:'#274a9c',g:'#f2c24a',l:'#6b4220'},p);
  const f=(b,l)=>spr(b.concat(l),P),o={};
  o.down=LEGS.d.map(l=>f(BODY.d,l));o.up=LEGS.d.map(l=>f(BODY.u,l));o.right=LEGS.s.map(l=>f(BODY.s,l));o.left=o.right.map(flip);return o;}
const SET={
 hero:human({}),
 smith:human({h:'#3a2a22',H:'#241a16',b:'#9a6a3a',B:'#5e3a1a',g:'#e8e2d2',l:'#3a2a22',s:'#e8b088',S:'#c08458'}),
 keeper:human({h:'#c0442e',H:'#8a2c1e',b:'#f2ead8',B:'#b9ad94',g:'#c0442e'}),
 guard:human({h:'#c5cad4',H:'#8f95a3',b:'#c0442e',B:'#8a2c1e',g:'#f2c24a',l:'#44485a'}),
 vil1:human({h:'#7a4a22',H:'#553216',b:'#4aa85a',B:'#2f7a3e',g:'#f2ead8'}),
 vil2:human({h:'#2a2a3a',H:'#1b1420',b:'#b05ac8',B:'#7a3a90',g:'#f2c24a'}),
 goblin:human({s:'#86c44e',S:'#5a9434',h:'#4a6a2a',H:'#32491c',e:'#ff2a2a',b:'#8a5a2b',B:'#5e3a1a',g:'#5e3a1a',l:'#3a2a22'})};
const SLIME=spr(["....oooo....","..ooGGGGoo..",".oGLLGGGGGo.",".oGLGGGGGGo.","oGGGeGGeGGGo","oGGGeGGeGGDo","oGGGGGGGGDDo",".oDDDDDDDDo.","..oooooooo.."],{o:INK,G:'#5fd35a',L:'#c8ffb0',D:'#2f9a45',e:INK});
const COIN=spr([".oooo.","oyYYyo","oyYyyo","oyyydo","oyyddo",".oooo."],{o:'#7a4a10',y:'#ffd24a',Y:'#fff3b0',d:'#e09a20'});
const HEART=spr([".oo.oo.","orwrrro","orrrrro",".orrro.","..oro..","...o..."],{o:INK,r:'#ff3b4a',w:'#ffc0c8'});
const HEARTE=spr([".oo.oo.","okkokko","okkkkko",".okkko.","..oko..","...o..."],{o:INK,k:'#4a3a4a'});
const BUBBLE=spr([".ooooooooo.","owwwwwwwwwo","owwrrwrrwwo","owwrrrrrwwo","owwwrrrwwwo","owwwwrwwwwo",".oooowoooo.","....owo....",".....o....."],{o:INK,w:'#ffffff',r:'#ff3b4a'});
const BANG=spr(["oooo","oyyo","oyyo","oyyo","oyyo","oooo","oyyo","oooo"],{o:INK,y:'#ffd24a'});

/* ---------- sprites: world objects ---------- */
function oak(v){const c=mk(36,44),g=c.getContext('2d'),p=v%2?['#12381f','#1c6632','#2c9644','#56c45a','#a6e36e']:['#143d22','#237038','#39a548','#6fd060','#c8f58a'];
  px(g,15,29,INK,7,13);px(g,16,29,'#8a5a2b',5,13);px(g,19,29,'#5e3a1a',2,13);px(g,14,41,INK,9,2);px(g,15,41,'#6b4220',7,1);
  const bl=[[18,16,12],[10,20,8],[26,20,8],[18,9,8],[11,12,6],[25,12,6]].map(b=>[b[0]+ri(-1,1),b[1]+ri(-1,1),b[2]]);
  bl.forEach(b=>disc(g,b[0],b[1],b[2]+1,p[0]));bl.forEach(b=>disc(g,b[0],b[1],b[2],p[1]));
  bl.forEach(b=>disc(g,b[0]-1,b[1]-1,b[2]-2,p[2]));bl.forEach(b=>{if(b[2]>5)disc(g,b[0]-2,b[1]-3,b[2]-5,p[3]);});
  for(let i=0;i<22;i++){const b=bl[ri(0,5)],a=R()*6.28,r=R()*b[2]*.7,x=b[0]+Math.cos(a)*r,y=b[1]+Math.sin(a)*r;
    if(x+y<b[0]+b[1]-2)px(g,x,y,p[4],2,1);else{px(g,x,y,p[1],2,1);px(g,x+1,y+1,p[1]);}}
  return c;}
function pine(){const c=mk(28,46),g=c.getContext('2d');px(g,11,36,INK,6,10);px(g,12,36,'#7a4a22',4,9);px(g,14,36,'#553216',2,9);
  [[14,1,7,15],[14,9,10,15],[14,18,13,18]].forEach(([cx,ty,hw,h])=>{for(let y=0;y<h;y++){const w=Math.max(1,Math.round(hw*(y+1)/h)+(y%4===3?1:0));
    px(g,cx-w-1,ty+y,'#0f3320',w*2+2,1);px(g,cx-w,ty+y,'#2a8a4a',w,1);px(g,cx,ty+y,'#1a5c34',w,1);if(w>3&&y%3===1)px(g,cx-w+2,ty+y,'#5cc87a',2,1);}
    px(g,cx-hw-1,ty+h,'#0f3320',hw*2+2,1);});return c;}
function bush(){const c=mk(16,12),g=c.getContext('2d');[[5,6,4],[10,6,4],[8,4,4]].forEach(b=>disc(g,b[0],b[1],b[2]+1,'#143d22'));
  [[5,6,4],[10,6,4],[8,4,4]].forEach(b=>disc(g,b[0],b[1],b[2],'#237038'));[[5,5,2],[10,5,2],[8,3,2]].forEach(b=>disc(g,b[0]-1,b[1],b[2],'#56c45a'));
  if(R()<.5){px(g,4,4,'#ff5a6a');px(g,10,7,'#ff5a6a');px(g,8,2,'#ffe14a');}return c;}
function barrel(){const c=mk(11,14),g=c.getContext('2d');px(g,1,0,INK,9,14);px(g,0,2,INK,11,10);px(g,1,1,'#b0783c',9,12);px(g,2,1,'#d09a58',2,12);px(g,8,1,'#7a4f24',2,12);
  px(g,1,1,'#6b4220',9,1);px(g,1,3,'#5a5f6a',9,2);px(g,1,9,'#5a5f6a',9,2);px(g,2,3,'#9aa0aa',2,1);px(g,2,9,'#9aa0aa',2,1);return c;}
function crate(){const c=mk(12,12),g=c.getContext('2d');px(g,0,0,INK,12,12);px(g,1,1,'#c08a4a',10,10);px(g,1,1,'#e0b070',10,1);px(g,1,10,'#8a5a2b',10,1);
  line(g,1,1,10,10,'#8a5a2b');line(g,10,1,1,10,'#8a5a2b');px(g,1,1,'#8a5a2b',1,10);px(g,10,1,'#8a5a2b',1,10);return c;}
function anvil(){return spr(["oooooooooooo..","oLLLLLLLLLLLoo","ommmmmmmmmmmmo",".oooommmmoooo.","....ommmo.....","...oommmoo....","..odddddddo...","..ooooooooo..."],{o:INK,L:'#aeb6c4',m:'#6a7284',d:'#444a5a'});}
function well(){const c=mk(26,30),g=c.getContext('2d');px(g,3,6,INK,3,18);px(g,20,6,INK,3,18);px(g,4,6,'#8a5a2b',1,18);px(g,21,6,'#8a5a2b',1,18);
  for(let y=0;y<8;y++){const w=4+y*1.4;px(g,13-w,y,y<2?'#e8684a':y<6?'#d0432f':'#a82f22',w*2,1);px(g,13-w,y,INK);px(g,13+w-1,y,INK);}px(g,1,8,INK,24,1);
  disc(g,13,22,11,INK,.5);px(g,2,22,INK,23,6);disc(g,13,27,11,INK,.3);disc(g,13,22,10,'#b4b8c0',.48);px(g,3,22,'#8d9199',21,5);disc(g,13,26,10,'#8d9199',.3);
  for(let x=4;x<23;x+=5)px(g,x,23,'#6b6f7a',1,5);px(g,3,25,'#6b6f7a',21,1);disc(g,13,22,7,'#1f4f9a',.42);px(g,10,21,'#6fb8f5',3,1);line(g,13,8,13,20,'#3a2a1a');return c;}
function lamp(){const c=mk(8,26),g=c.getContext('2d');px(g,3,7,INK,3,19);px(g,4,7,'#4a4d58',1,18);px(g,2,24,INK,5,2);px(g,1,0,INK,7,8);px(g,2,1,'#ffd66b',5,6);px(g,3,2,'#fff3b0',3,3);px(g,1,0,'#4a4d58',7,1);px(g,4,1,INK,1,6);return c;}
function fence(){const c=mk(16,12),g=c.getContext('2d');px(g,0,3,INK,16,4);px(g,0,4,'#d0a060',16,1);px(g,0,5,'#a87840',16,1);px(g,0,8,INK,16,3);px(g,0,9,'#a87840',16,1);
  [1,9].forEach(x=>{px(g,x,0,INK,5,12);px(g,x+1,1,'#e0b878',2,10);px(g,x+3,1,'#a87840',1,10);});return c;}
